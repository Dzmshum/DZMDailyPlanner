<!DOCTYPE html>
<html lang="ru">
<meta charset="utf-8"/>
<title>PlanBoard README preview</title>
<style>
  body { margin: 0; background: #0d1117; color: #e6edf3; font: 16px/1.5 -apple-system, Segoe UI, sans-serif; }
  .wrap { max-width: 900px; margin: 24px auto; padding: 0 16px 48px; }
  img { display: block; width: 100%; height: auto; margin: 20px 0; border-radius: 12px; }
  .icon { width: 96px; height: 96px; margin: 12px auto; }
  h1 { font-size: 20px; color: #8b949e; font-weight: 500; }
  p { color: #c9d1d9; }
  a { color: #58a6ff; }
</style>
<body>
  <div class="wrap">
    <h1>Локальный preview README (как на GitHub ~900px)</h1>
    <p>Файлы лежат в <code>assets/readme/</code>. Открой также <a href="/README.md">README.md</a> сырьём.</p>
    <img src="/assets/readme/hero.png" alt="hero"/>
    <img class="icon" src="/assets/readme/icon.png" alt="icon"/>
    <img src="/assets/readme/workflow.png" alt="workflow"/>
    <img src="/assets/readme/section-start.png" alt="start"/>
    <img src="/assets/readme/section-features.png" alt="features"/>
    <img src="/assets/readme/section-build.png" alt="build"/>
  </div>
</body>
</html>
