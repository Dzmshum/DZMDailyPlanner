      <rect x="144" y="0" width="40" height="28" rx="6" fill="#22262f"/>
      <text x="156" y="19" fill="#6e7380">Чт</text>
      <rect x="192" y="0" width="40" height="28" rx="6" fill="#22262f"/>
      <text x="204" y="19" fill="#6e7380">Пт</text>
